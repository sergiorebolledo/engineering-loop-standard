name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, lint, test, doctor (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 4 (pulled in to clear an esbuild/vite audit finding) needs
        # Node >= 20 (util.styleText). This only affects running this
        # repo's own test suite — the published CLI still supports
        # Node >= 18 at runtime, verified by the runtime-compat job below.
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build engineering-loop CLI
        run: npm run build

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate this repo against its own standard (dogfood)
        run: npm run doctor

  runtime-compat:
    name: Packed CLI runs on Node ${{ matrix.node-version }} (no test runner)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Proves the published tarball's actual runtime floor (engines:
        # ">=18" in packages/cli/package.json), independent of what Node
        # version the dev/test tooling itself requires.
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build engineering-loop CLI
        run: npm run build

      - name: Verify the packed tarball installs and runs
        run: |
          cd packages/cli
          npm pack
          mkdir -p /tmp/els-ci-install
          npm install "$(pwd)"/engineering-loop-*.tgz --no-save --prefix /tmp/els-ci-install
          /tmp/els-ci-install/node_modules/.bin/engineering-loop --version
          /tmp/els-ci-install/node_modules/.bin/engineering-loop init --dir /tmp/els-ci-install/sample-app --name ci-sample-app
          /tmp/els-ci-install/node_modules/.bin/engineering-loop doctor --dir /tmp/els-ci-install/sample-app
